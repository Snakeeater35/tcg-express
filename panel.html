<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG Express — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141c; --paper:#f3ede0; --gold:#c9a227; --gold-soft:#e4c766;
    --text:#eae7de; --text-dim:#9a9db1; --panel:#1b1e2b; --line:#2c2f42;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at top, #1a1e2c 0%, var(--ink) 60%);
    color:var(--text); font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh; padding:36px 16px 60px; line-height:1.5;
  }
  .wrap{ max-width:780px; margin:0 auto; }
  .kicker{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--gold-soft); margin:0 0 10px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,5.5vw,34px); margin:0 0 22px; color:var(--paper); }

  /* Login */
  .login-card{
    background:var(--paper); color:#1c1a14; border-radius:16px; padding:28px 24px;
    max-width:380px; margin:60px auto;
  }
  .login-card h2{ font-family:'Fraunces',serif; font-size:22px; margin:0 0 18px; }
  .fg{ margin-bottom:14px; }
  label{ display:block; font-size:12.5px; font-weight:600; color:#514a34; margin-bottom:5px; }
  input, select{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:14.5px;
    padding:10px 11px; border-radius:7px; border:1.5px solid #cfc5a4;
    background:#fffdf7; color:#1c1a14; outline:none;
  }
  input:focus, select:focus{ border-color:var(--gold); }
  .btn-primary{
    width:100%; background:#1e5c4a; color:#f3ede0; border:none; border-radius:8px;
    padding:12px; font-weight:600; cursor:pointer; font-size:15px; margin-top:6px;
  }
  .login-error{ color:#c9584a; font-size:13px; margin-top:10px; min-height:16px; }

  /* Panel */
  #panel{ display:none; }
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .tab{
    background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    font-size:13px; padding:7px 12px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .tab.active{ background:var(--gold); color:#1c1a14; border-color:var(--gold); font-weight:600; }
  .spacer{ flex:1; }
  .btn-logout{
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer;
  }
  .empty{ color:var(--text-dim); font-size:14px; padding:30px 6px; text-align:center; }

  .order{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
  }
  .order-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .order-title{ font-weight:600; font-size:15px; color:var(--paper); }
  .order-sub{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
  .order-meta{ font-size:12.5px; color:var(--text-dim); margin-top:8px; }
  .order-bottom{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  select.status{
    background:#0e1017; color:var(--paper); border:1px solid var(--line); border-radius:7px;
    padding:7px 9px; font-size:13px;
  }
  .badge{ font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .badge-Cotizado{ background:#3a3320; color:var(--gold-soft); }
  .badge-Pagado50{ background:#233a52; color:#7fb2e6; }
  .badge-Comprado{ background:#2a3a24; color:#9bd17e; }
  .badge-EnCamino{ background:#3a2c1a; color:#e0a35f; }
  .badge-Entregado{ background:#1e3a2c; color:#5fdba0; }
  .btn-cotizar{
    background:transparent; border:1px solid var(--gold); color:var(--gold-soft);
    border-radius:7px; padding:6px 10px; font-size:12.5px; cursor:pointer;
  }
  .quote-box{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
  }
  .quote-box .qrow{ display:flex; gap:10px; }
  .quote-box .fg{ flex:1; margin-bottom:10px; min-width:0; }
  .quote-box label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:4px; }
  .quote-box input, .quote-box select{
    width:100%; font-size:13.5px; padding:8px 9px; border-radius:7px;
    border:1px solid var(--line); background:#0e1017; color:var(--paper);
  }
  .q-desglose{ margin-bottom:12px; }
  .q-linea{
    display:flex; justify-content:space-between; font-size:13px; color:var(--text-dim);
    padding:3px 0;
  }
  .q-linea.q-total-linea{
    font-weight:600; color:var(--paper); border-top:1px solid var(--line);
    margin-top:4px; padding-top:7px;
  }
  .btn-guardar-cotizacion{
    width:100%; background:#1e5c4a; color:#f3ede0; border:none; border-radius:8px;
    padding:10px; font-weight:600; cursor:pointer; font-size:13.5px; margin-bottom:8px;
  }
  .btn-whatsapp-cot{
    width:100%; background:#226b56; color:#f3ede0; border:1px solid #3a8a6f; border-radius:8px;
    padding:10px; font-weight:600; cursor:pointer; font-size:13.5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">TCG Express</p>
  <h1>Panel de pedidos</h1>

  <div class="login-card" id="loginCard">
    <h2>Iniciar sesión</h2>
    <div class="fg"><label for="loginEmail">Correo</label><input id="loginEmail" type="email"></div>
    <div class="fg"><label for="loginPass">Contraseña</label><input id="loginPass" type="password"></div>
    <button class="btn-primary" id="btnLogin">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <div class="login-card" id="resetCard" style="display:none;">
    <h2>Elige tu nueva contraseña</h2>
    <div class="fg"><label for="resetPass">Nueva contraseña</label><input id="resetPass" type="password"></div>
    <div class="fg"><label for="resetPass2">Repite la contraseña</label><input id="resetPass2" type="password"></div>
    <button class="btn-primary" id="btnReset">Guardar contraseña</button>
    <div class="login-error" id="resetError"></div>
  </div>

  <div id="panel">
    <div class="toolbar" id="tabs"></div>
    <div class="toolbar">
      <span></span><div class="spacer"></div>
      <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
    </div>
    <div id="lista"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://eivfoxxrnfcvdjkebqjh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_pPju-InTZp4zyv95SeHNNg_jo4t0ahB';

  const ESTADOS = ['Cotizado', 'Pagado50', 'Comprado', 'EnCamino', 'Entregado'];
  const ESTADO_LABEL = { Cotizado:'Cotizado', Pagado50:'Pagado 50%', Comprado:'Comprado', EnCamino:'En camino', Entregado:'Entregado' };

  let sb = null;
  let pedidos = [];
  let filtro = 'Todos';
  let tipoCambio = null; // EUR -> PEN

  async function cargarTipoCambio(){
    try{
      const res = await fetch('https://open.er-api.com/v6/latest/EUR');
      const json = await res.json();
      if(json && json.rates && json.rates.PEN){
        tipoCambio = json.rates.PEN;
      }
    }catch(e){
      console.error('No se pudo obtener el tipo de cambio:', e);
    }
    actualizarTextoTC();
  }

  function actualizarTextoTC(){
    document.querySelectorAll('.q-tc').forEach(el => {
      el.textContent = tipoCambio ? ('1€ = S/ ' + tipoCambio.toFixed(3)) : 'cargando...';
    });
  }

  const loginCard = document.getElementById('loginCard');
  const panel = document.getElementById('panel');
  const loginError = document.getElementById('loginError');
  const listaEl = document.getElementById('lista');
  const tabsEl = document.getElementById('tabs');

  function fmt(n){ return n ? '€ ' + Number(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'; }

  function renderTabs(){
    const counts = { Todos: pedidos.length };
    ESTADOS.forEach(e => counts[e] = pedidos.filter(p => p.estado_pedido === e).length);
    const tabs = ['Todos', ...ESTADOS];
    tabsEl.innerHTML = tabs.map(t => {
      const label = t === 'Todos' ? 'Todos' : ESTADO_LABEL[t];
      return `<button class="tab ${filtro===t?'active':''}" data-tab="${t}">${label} (${counts[t]||0})</button>`;
    }).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => { filtro = btn.dataset.tab; renderTabs(); renderLista(); });
    });
  }

  function renderLista(){
    const items = filtro === 'Todos' ? pedidos : pedidos.filter(p => p.estado_pedido === filtro);
    if(items.length === 0){
      listaEl.innerHTML = '<div class="empty">No hay pedidos en esta vista.</div>';
      return;
    }
    listaEl.innerHTML = items.map(p => `
      <div class="order" data-id="${p.id}">
        <div class="order-top">
          <div>
            <div class="order-title">${p.tcg || ''} — ${p.carta || '(sin nombre)'}</div>
            <div class="order-sub">${p.cliente || 'Sin cliente'} ${p.telefono ? '· ' + p.telefono : ''}</div>
          </div>
        </div>
        <div class="order-meta">
          ${p.codigo ? p.codigo + ' · ' : ''}${p.rareza ? p.rareza + ' · ' : ''}${p.idioma ? p.idioma + ' · ' : ''}${p.estado_carta ? p.estado_carta + ' · ' : ''}Cant. ${p.cantidad || 1}
          ${p.acabado ? '<br>Acabado: ' + p.acabado : ''}${p.edicion && p.edicion !== 'No aplica' ? ' · ' + p.edicion : ''}
          ${p.precio_cardmarket ? '<br>Precio unidad: ' + fmt(p.precio_cardmarket) : ''}
          ${p.total ? ' · Total: ' + fmt(p.total) : ''}${p.total_pen ? ' (S/ ' + Number(p.total_pen).toFixed(2) + ')' : ''}
        </div>
        <div class="order-bottom">
          <span class="badge badge-${p.estado_pedido}">${ESTADO_LABEL[p.estado_pedido] || p.estado_pedido}</span>
          <select class="status" data-id="${p.id}">
            ${ESTADOS.map(e => `<option value="${e}" ${e===p.estado_pedido?'selected':''}>${ESTADO_LABEL[e]}</option>`).join('')}
          </select>
          <button class="btn-cotizar" data-id="${p.id}">${p.total ? 'Editar cotización' : 'Cotizar'}</button>
        </div>
        <div class="quote-box" id="quote-${p.id}" style="display:none;">
          <div class="fg">
            <label>Precio Cardmarket por unidad (€)</label>
            <input type="number" min="0" step="0.01" class="q-precio" data-id="${p.id}" value="${p.precio_cardmarket || ''}">
          </div>
          <div class="q-desglose" id="desglose-${p.id}">
            <div class="q-linea"><span>Precio unidad</span><span class="q-unit">€ 0.00</span></div>
            <div class="q-linea"><span>× cantidad (${p.cantidad || 1})</span><span class="q-subtotal">€ 0.00</span></div>
          </div>
          <div class="fg">
            <label>Precio de venta final (€) — <span class="q-margen-pct">margen 35%</span></label>
            <input type="number" min="0" step="0.01" class="q-total-eur-input" data-id="${p.id}" value="${p.total || ''}">
          </div>
          <div class="fg">
            <label>Total a cobrar — tipo de cambio: <span class="q-tc">...</span> (ajustable si quieres redondear)</label>
            <input type="number" min="0" step="0.5" class="q-total-pen" data-id="${p.id}" value="${p.total_pen || ''}">
          </div>
          <div class="fg">
            <label>Método de pago</label>
            <select class="q-metodo" data-id="${p.id}">
              <option value="Yape" ${p.metodo_pago==='Yape'?'selected':''}>Yape</option>
              <option value="Link tarjeta" ${p.metodo_pago==='Link tarjeta'?'selected':''}>Link tarjeta (CulqiLink)</option>
            </select>
          </div>
          <button class="btn-guardar-cotizacion" data-id="${p.id}">Guardar cotización</button>
          <button class="btn-whatsapp-cot" data-id="${p.id}">Enviar cotización por WhatsApp</button>
        </div>
      </div>
    `).join('');

    listaEl.querySelectorAll('select.status').forEach(sel => {
      sel.addEventListener('change', async () => {
        await sb.from('pedidos').update({ estado_pedido: sel.value }).eq('id', sel.dataset.id);
      });
    });

    listaEl.querySelectorAll('.btn-cotizar').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = document.getElementById('quote-' + btn.dataset.id);
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
      });
    });

    function subtotalDe(id){
      const pedido = pedidos.find(p => String(p.id) === String(id));
      const cantidad = (pedido && pedido.cantidad) || 1;
      const precio = parseFloat(listaEl.querySelector(`.q-precio[data-id="${id}"]`).value) || 0;
      return precio * cantidad;
    }

    // Precio Cardmarket -> aplica 35% por defecto y llena el total de venta
    function recalcularDesdePrecio(id){
      const pedido = pedidos.find(p => String(p.id) === String(id));
      const cantidad = (pedido && pedido.cantidad) || 1;
      const precio = parseFloat(listaEl.querySelector(`.q-precio[data-id="${id}"]`).value) || 0;
      const subtotal = precio * cantidad;
      const totalEur = subtotal * 1.35;

      document.getElementById('desglose-' + id).querySelector('.q-unit').textContent = fmt(precio);
      document.getElementById('desglose-' + id).querySelector('.q-subtotal').textContent = fmt(subtotal);

      const totalInput = listaEl.querySelector(`.q-total-eur-input[data-id="${id}"]`);
      totalInput.value = totalEur.toFixed(2);
      actualizarMargenYTotalPen(id);
    }

    // Total de venta final -> recalcula qué % de margen representa
    function actualizarMargenYTotalPen(id){
      const subtotal = subtotalDe(id);
      const totalInput = listaEl.querySelector(`.q-total-eur-input[data-id="${id}"]`);
      const totalEur = parseFloat(totalInput.value) || 0;
      const pct = subtotal > 0 ? ((totalEur / subtotal) - 1) * 100 : 0;

      const card = document.querySelector(`.order[data-id="${id}"]`);
      card.querySelector('.q-margen-pct').textContent = `margen ${pct.toFixed(1)}%`;

      const totalPenInput = listaEl.querySelector(`.q-total-pen[data-id="${id}"]`);
      if(tipoCambio){
        totalPenInput.value = (totalEur * tipoCambio).toFixed(2);
      }
      return totalEur;
    }

    function recalcularDesglose(id){
      // Usado al enviar por WhatsApp: toma el total de venta actual, el que esté.
      return actualizarMargenYTotalPen(id);
    }

    listaEl.querySelectorAll('.q-precio').forEach(inp => {
      inp.addEventListener('input', () => recalcularDesdePrecio(inp.dataset.id));
      if(inp.value) recalcularDesdePrecio(inp.dataset.id);
    });

    listaEl.querySelectorAll('.q-total-eur-input').forEach(inp => {
      inp.addEventListener('input', () => actualizarMargenYTotalPen(inp.dataset.id));
      if(inp.value) actualizarMargenYTotalPen(inp.dataset.id);
    });

    listaEl.querySelectorAll('.btn-guardar-cotizacion').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const precio = parseFloat(listaEl.querySelector(`.q-precio[data-id="${id}"]`).value) || 0;
        const total = parseFloat(listaEl.querySelector(`.q-total-eur-input[data-id="${id}"]`).value) || 0;
        const totalPen = parseFloat(listaEl.querySelector(`.q-total-pen[data-id="${id}"]`).value) || 0;
        const metodo = listaEl.querySelector(`.q-metodo[data-id="${id}"]`).value;
        btn.disabled = true;
        btn.textContent = 'Guardando...';
        await sb.from('pedidos').update({
          precio_cardmarket: precio,
          total: total,
          total_pen: totalPen,
          metodo_pago: metodo
        }).eq('id', id);
        btn.disabled = false;
        btn.textContent = 'Guardar cotización';
      });
    });

    function telefonoWhatsapp(numero){
      let limpio = (numero || '').replace(/[^0-9]/g, '');
      if(!limpio.startsWith('51')) limpio = '51' + limpio;
      return limpio;
    }

    listaEl.querySelectorAll('.btn-whatsapp-cot').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const pedido = pedidos.find(p => String(p.id) === String(id));
        if(!pedido || !pedido.telefono){
          alert('Este pedido no tiene teléfono registrado.');
          return;
        }
        const totalEur = recalcularDesglose(id);
        const totalPenInput = listaEl.querySelector(`.q-total-pen[data-id="${id}"]`);
        const totalPen = parseFloat(totalPenInput.value) || 0;
        const metodo = listaEl.querySelector(`.q-metodo[data-id="${id}"]`).value;

        const pagoTexto = metodo === 'Yape'
          ? 'Puedes pagar por Yape al 997 205 413.'
          : 'Te paso un link de pago por tarjeta (CulqiLink) para que completes el pago.';

        const lineas = [
          `¡Hola ${pedido.cliente || ''}! Aquí tu cotización:`,
          '',
          `${pedido.tcg} — ${pedido.carta}`,
          pedido.codigo ? `Código: ${pedido.codigo}` : null,
          pedido.rareza ? `Rareza: ${pedido.rareza}` : null,
          pedido.idioma ? `Idioma: ${pedido.idioma}` : null,
          pedido.estado_carta ? `Estado: ${pedido.estado_carta}` : null,
          pedido.acabado ? `Acabado: ${pedido.acabado}` : null,
          (pedido.edicion && pedido.edicion !== 'No aplica') ? `Edición: ${pedido.edicion}` : null,
          `Cantidad: ${pedido.cantidad || 1}`,
          '',
          `Total: S/ ${totalPen.toFixed(2)} (€ ${totalEur.toFixed(2)}, incluye envío)`,
          '',
          pagoTexto,
          'Recuerda: el pago es 50% para confirmar el pedido y 50% contra entrega. El tiempo de llegada estimado es de 3 a 4 semanas.'
        ].filter(Boolean);

        const texto = encodeURIComponent(lineas.join('\n'));
        const url = `https://wa.me/${telefonoWhatsapp(pedido.telefono)}?text=${texto}`;
        window.open(url, '_blank', 'noopener');
      });
    });

    actualizarTextoTC();
  }

  async function cargarPedidos(){
    const { data, error } = await sb.from('pedidos').select('*').order('created_at', { ascending: false }).limit(500);
    if(error){
      listaEl.innerHTML = '<div class="empty">Error cargando pedidos: ' + error.message + '</div>';
      return;
    }
    pedidos = data || [];
    renderTabs();
    renderLista();
  }

  function mostrarPanel(){
    loginCard.style.display = 'none';
    panel.style.display = 'block';
    cargarPedidos();
    cargarTipoCambio();
    sb.channel('pedidos-cambios')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, cargarPedidos)
      .subscribe();
  }

  async function init(){
    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }catch(e){
      loginError.textContent = 'No se pudo conectar. Recarga la página.';
      return;
    }

    const resetCard = document.getElementById('resetCard');
    const resetError = document.getElementById('resetError');

    sb.auth.onAuthStateChange((event, session) => {
      if(event === 'PASSWORD_RECOVERY'){
        loginCard.style.display = 'none';
        panel.style.display = 'none';
        resetCard.style.display = 'block';
      }
    });

    document.getElementById('btnReset').addEventListener('click', async () => {
      resetError.textContent = '';
      const p1 = document.getElementById('resetPass').value;
      const p2 = document.getElementById('resetPass2').value;
      if(p1.length < 6){
        resetError.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        return;
      }
      if(p1 !== p2){
        resetError.textContent = 'Las contraseñas no coinciden.';
        return;
      }
      const { error } = await sb.auth.updateUser({ password: p1 });
      if(error){
        resetError.textContent = 'No se pudo guardar: ' + error.message;
        return;
      }
      resetCard.style.display = 'none';
      mostrarPanel();
    });

    const { data: { session } } = await sb.auth.getSession();
    if(session){ mostrarPanel(); }

    document.getElementById('btnLogin').addEventListener('click', async () => {
      loginError.textContent = '';
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        loginError.textContent = 'Correo o contraseña incorrectos.';
        return;
      }
      mostrarPanel();
    });

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await sb.auth.signOut();
      panel.style.display = 'none';
      loginCard.style.display = 'block';
    });
  }

  init();
</script>
</body>
</html>
